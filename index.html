<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Estádio Seguro</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; overflow: hidden; background: #111; }
        #status-bar { height: 35px; background: #222; color: #aaa; text-align: center; line-height: 35px; font-size: 0.9rem; font-weight: bold; }
        .grid { flex: 1; display: flex; }
        button { flex: 1; border: none; color: white; font-size: 3.5rem; font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .btn-green { background-color: #2ecc71; }
        .btn-red { background-color: #e74c3c; }
        button:active { opacity: 0.6; }
    </style>
</head>
<body>

    <div id="status-bar">BLOQUEADO - INSIRA A SENHA</div>
    
    <div class="grid">
        <button class="btn-green" onclick="enviar('G')">GREEN</button>
        <button class="btn-red" onclick="enviar('R')">RED</button>
    </div>

    <script>
        const statusBar = document.getElementById('status-bar');
        let socket;
        let autenticado = false;
        
        // 🔒 DEFINA SUA SENHA DE 4 DÍGITOS AQUI
        const SENHA_CORRETA = "1234"; 

        const SERVER_URL = 'wss://://onrender.com'; 

        function verificarSenha() {
            const senhaDigitada = prompt("Digite a senha de 4 dígitos para liberar o painel:");
            if (senhaDigitada === SENHA_CORRETA) {
                autenticado = true;
                conectar();
            } else {
                alert("Senha incorreta! O painel continuará bloqueado.");
                statusBar.innerText = "❌ ACESSO NEGADO";
                statusBar.style.backgroundColor = "#c0392b";
                statusBar.style.color = "#fff";
            }
        }

        function conectar() {
            socket = new WebSocket(SERVER_URL);

            socket.onopen = () => {
                statusBar.innerText = "🔴 ONLINE (PAINEL LIBERADO)";
                statusBar.style.backgroundColor = "#27ae60";
                statusBar.style.color = "#fff";
            };

            socket.onclose = () => {
                if (autenticado) {
                    statusBar.innerText = "⚠️ SEM SINAL! RECONECTANDO...";
                    statusBar.style.backgroundColor = "#e67e22";
                    statusBar.style.color = "#fff";
                    setTimeout(conectar, 1000); 
                }
            };

            socket.onerror = () => {
                socket.close();
            };
        }

        setInterval(() => {
            if (autenticado && socket && socket.readyState === WebSocket.OPEN) {
                socket.send('H');
            }
        }, 15000);

        function enviar(sinal) {
            if (!autenticado) {
                alert("Painel bloqueado! Recarregue a página e insira a senha correta.");
                return;
            }

            if (navigator.vibrate) {
                navigator.vibrate(80);
            }

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(sinal);
            } else {
                statusBar.innerText = "❌ ERRO: SEM INTERNET AGORA!";
                statusBar.style.backgroundColor = "#c0392b";
            }
        }

        // Executa a validação assim que o site abre
        verificarSenha();
    </script>
</body>
</html>
