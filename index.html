<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Estádio Seguro Inteligente</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; overflow: hidden; background: #111; }
        #status-bar { height: 35px; background: #222; color: #aaa; text-align: center; line-height: 35px; font-size: 0.9rem; font-weight: bold; }
        .grid { flex: 1; display: flex; }
        button { flex: 1; border: none; color: white; font-size: 3.5rem; font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .btn-green { background-color: #2ecc71; }
        .btn-red { background-color: #e74c3c; }
        button:active { opacity: 0.6; }
    </style>
</head>
<body>

    <div id="status-bar">AGUARDANDO AUTENTICAÇÃO...</div>
    
    <div class="grid">
        <button class="btn-green" onclick="enviar('G')">GREEN</button>
        <button class="btn-red" onclick="enviar('R')">RED</button>
    </div>

    <script>
        const statusBar = document.getElementById('status-bar');
        let socket;
        let painelLiberado = false;
        
        // 🔒 SUA CONFIGURAÇÃO DE SENHA E LINK
        const SENHA_CORRETA = "1234";
        const SERVER_URL = 'wss://trader-app-g12q.onrender.com';

        function verificarSenhaInicial() {
            const senhaDigitada = prompt("Digite a senha de segurança para liberar o painel:");
            
            if (senhaDigitada === SENHA_CORRETA) {
                painelLiberado = true;
                conectar(); // Só tenta conectar na internet se a senha estiver certa
            } else {
                alert("Senha incorreta! O painel continuará bloqueado.");
                statusBar.innerText = "❌ ACESSO BLOQUEADO";
                statusBar.style.backgroundColor = "#c0392b";
                statusBar.style.color = "#fff";
            }
        }

        function conectar() {
            if (!painelLiberado) return;

            socket = new WebSocket(SERVER_URL);

            socket.onopen = () => {
                statusBar.innerText = "🔴 ONLINE (PRONTO PARA ENVIAR)";
                statusBar.style.backgroundColor = "#27ae60";
                statusBar.style.color = "#fff";
            };

            socket.onclose = () => {
                if (painelLiberado) {
                    statusBar.innerText = "⚠️ SEM SINAL! RECONECTANDO...";
                    statusBar.style.backgroundColor = "#e67e22";
                    statusBar.style.color = "#fff";
                    setTimeout(conectar, 1000); 
                }
            };

            socket.onerror = () => {
                socket.close();
            };
        }

        // Heartbeat para manter o servidor grátis acordado durante o jogo
        setInterval(() => {
            if (painelLiberado && socket && socket.readyState === WebSocket.OPEN) {
                socket.send('H');
            }
        }, 15000);

        function enviar(sinal) {
            if (!painelLiberado) {
                alert("Painel bloqueado!");
                return;
            }

            if (navigator.vibrate) {
                navigator.vibrate(80);
            }

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(sinal); // Envia direto, SEM pedir senha novamente!
            } else {
                statusBar.innerText = "❌ ERRO: SERVIDOR DESCONECTADO!";
                statusBar.style.backgroundColor = "#c0392b";
            }
        }

        // Roda o pedido de senha apenas 1 vez quando a página termina de carregar
        window.onload = () => {
            // Pequeno tempo de 300ms para dar tempo do navegador carregar o visual antes do pop-up
            setTimeout(verificarSenhaInicial, 300);
        };
    </script>
</body>
</html>
