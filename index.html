<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Painel Estádio Seguro Pro</title>
    <style>
        body { margin: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; overflow: hidden; background: #111; }
        #status-bar { height: 35px; background: #c0392b; color: #fff; text-align: center; line-height: 35px; font-size: 0.9rem; font-weight: bold; }
        .grid { flex: 1; display: flex; }
        button { flex: 1; border: none; color: white; font-size: 3.5rem; font-weight: bold; cursor: pointer; -webkit-tap-highlight-color: transparent; }
        .btn-green { background-color: #2ecc71; }
        .btn-red { background-color: #e74c3c; }
        button:active { opacity: 0.6; }
    </style>
</head>
<body>

    <div id="status-bar">AGUARDANDO VALIDAÇÃO DE ACESSO...</div>
    
    <div class="grid">
        <button class="btn-green" onclick="enviar('G')">GREEN</button>
        <button class="btn-red" onclick="enviar('R')">RED</button>
    </div>

    <script>
        const statusBar = document.getElementById('status-bar');
        let socket = null;
        let autenticado = false;
        
        // SUA CONFIGURAÇÃO DE SENHA E LINK
        const SENHA_CORRETA = "1234"; 
        const SERVER_URL = 'wss://://onrender.com'; 

        function conectar() {
            if (!autenticado) return;
            
            statusBar.innerText = "⏳ CONECTANDO AO SERVIDOR...";
            statusBar.style.backgroundColor = "#e67e22";

            socket = new WebSocket(SERVER_URL);

            socket.onopen = () => {
                statusBar.innerText = "🟢 ONLINE (PRONTO PARA ENVIAR)";
                statusBar.style.backgroundColor = "#27ae60";
            };

            socket.onclose = () => {
                if (autenticado) {
                    statusBar.innerText = "⚠️ SEM SINAL! RECONECTANDO EM 2S...";
                    statusBar.style.backgroundColor = "#d35400";
                    setTimeout(conectar, 2000); 
                }
            };

            socket.onerror = (err) => {
                console.error("Erro no WebSocket:", err);
            };
        }

        // Heartbeat para manter o servidor acordado
        setInterval(() => {
            if (autenticado && socket && socket.readyState === WebSocket.OPEN) {
                socket.send('H');
            }
        }, 15000);

        function enviar(sinal) {
            if (!autenticado) {
                alert("Painel bloqueado! Insira a senha correta.");
                return;
            }

            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(sinal);
                if (navigator.vibrate) navigator.vibrate(60);
            } else {
                statusBar.innerText = "❌ ERRO: SEM INTERNET AGORA!";
                statusBar.style.backgroundColor = "#c0392b";
            }
        }

        // Controla o fluxo inicial de forma segura
        window.addEventListener('load', () => {
            const senhaDigitada = prompt("Digite a senha de 4 dígitos para liberar o painel:");
            if (senhaDigitada === SENHA_CORRETA) {
                autenticado = true;
                conectar();
            } else {
                alert("Senha incorreta!");
                statusBar.innerText = "❌ ACESSO BLOQUEADO - SENHA INCORRETA";
                statusBar.style.backgroundColor = "#7f8c8d";
            }
        });
    </script>
</body>
</html>
