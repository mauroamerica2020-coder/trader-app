<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptor Casa Profissional</title>
    <style>
        body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; transition: background 0.1s ease; background: #2c3e50; color: white;}
        #status { font-size: 4rem; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); text-align: center; padding: 0 20px; }
    </style>
</head>
<body>

    <div id="status">CLIQUE EM QUALQUER LUGAR DA TELA PARA CONECTAR</div>

    <script>
        let socket;
        const statusDiv = document.getElementById('status');
        let audioCtx = null;
        let sistemaLiberado = false;
        
        const SERVER_URL = 'wss://trader-app-g12q.onrender.com';

        // Ativa o áudio nativo sem depender de links externos no primeiro clique
        document.body.onclick = () => {
            if (!sistemaLiberado) {
                sistemaLiberado = true;
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                statusDiv.innerText = "CONECTANDO AO SERVIDOR...";
                document.body.style.backgroundColor = "#d35400"; // Laranja temporário
                conectarCasa();
            }
        };

        // Bipe matemático limpo e infalível gerado pelo próprio processador
        function dispararSomEletronico() {
            if (!audioCtx) return;
            try {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime); // Som agudo limpo
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime); // Volume

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.20); // Duração ideal de 0.20 segundos
            } catch (e) {
                console.log("Erro ao processar som nativo:", e);
            }
        }

        function conectarCasa() {
            socket = new WebSocket(SERVER_URL);

            socket.onopen = () => {
                statusDiv.innerText = "ONLINE! AGUARDANDO SINAL DO ESTÁDIO...";
                document.body.style.backgroundColor = "#2c3e50"; // Volta para o azul escuro padrão
            };

            socket.onmessage = (event) => {
                const comando = event.data;
                if (comando === 'G') {
                    document.body.style.backgroundColor = '#2ecc71';
                    statusDiv.innerText = 'GREEN / ENTRAR!';
                    dispararSomEletronico(); 
                } else if (comando === 'R') {
                    document.body.style.backgroundColor = '#e74c3c';
                    statusDiv.innerText = 'RED / FECHAR!';
                    dispararSomEletronico(); 
                }
            };

            socket.onclose = () => {
                if (sistemaLiberado) {
                    statusDiv.innerText = 'CONEXÃO PERDIDA! RECONECTANDO EM 1S...';
                    document.body.style.backgroundColor = '#000';
                    setTimeout(conectarCasa, 1000); 
                }
            };
        }
    </script>
</body>
</html>
