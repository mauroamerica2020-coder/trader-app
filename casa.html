<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptor Casa Som Nativo</title>
    <style>
        body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; transition: background 0.1s ease; background: #2c3e50; color: white;}
        #status { font-size: 4rem; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); text-align: center; }
    </style>
</head>
<body>

    <div id="status">CLIQUE EM QUALQUER LUGAR DA TELA PARA ATIVAR O ALARME</div>

    <script>
        let socket;
        const statusDiv = document.getElementById('status');
        let audioCtx = null;
        
        const SERVER_URL = 'wss://://onrender.com'; 

        // Ativa o sistema de som nativo do computador no primeiro clique do seu amigo na tela
        document.body.onclick = () => {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            statusDiv.innerText = "CONECTADO! AGUARDANDO SINAL DO ESTÁDIO...";
            document.body.style.backgroundColor = "#2c3e50";
        };

        // Cria um som eletrônico agudo matematicamente sem depender de arquivos ou links externos
        function dispararAlarme() {
            if (!audioCtx) return;
            try {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(1000, audioCtx.currentTime); // Som agudo claro
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime); // Volume

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.25); // Duração curta de 0.25 segundos
            } catch (e) {
                console.log("Erro som:", e);
            }
        }

        function conectarCasa() {
            socket = new WebSocket(SERVER_URL);

            socket.onopen = () => {
                if (!audioCtx) {
                    statusDiv.innerText = "CLIQUE EM QUALQUER LUGAR DA TELA PARA ATIVAR O ALARME";
                }
            };

            socket.onmessage = (event) => {
                const comando = event.data;
                if (comando === 'G') {
                    document.body.style.backgroundColor = '#2ecc71';
                    statusDiv.innerText = 'GREEN / ENTRAR!';
                    dispararAlarme(); 
                } else if (comando === 'R') {
                    document.body.style.backgroundColor = '#e74c3c';
                    statusDiv.innerText = 'RED / FECHAR!';
                    dispararAlarme(); 
                }
            };

            socket.onclose = () => {
                statusDiv.innerText = 'CONEXÃO PERDIDA! RECONECTANDO...';
                document.body.style.backgroundColor = '#000';
                setTimeout(conectarCasa, 1000); 
            };
        }

        conectarCasa();
    </script>
</body>
</html>
